version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      toolchain-updates:
        patterns:
          - "@types/*"
          - "@vitejs/*"
          - "@vitest/*"
          - "eslint*"
          - oxfmt
          - oxlint
          - playwright
          - prettier
          - rollup
          - rolldown
          - tsdown
          - typescript
          - vite
          - vite-plus
          - vitest
          - wrangler
        update-types:
          - minor
          - patch
      production-updates:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-updates:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      routine-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
